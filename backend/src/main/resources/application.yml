server:
  port: ${PORT:8080}
  error:
    include-message: always
    include-binding-errors: always

spring:
  application:
    name: verdant-crm

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/crm_db}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  web:
    resources:
      static-locations: classpath:/static/,file:./frontend/

app:
  jwt:
    secret: ${AUTH_SECRET:verdantCrmSuperSecretKeyThatIsAtLeast256BitsLongForSecureHmacSha256TokenSigning2026!}
    expiration-ms: 86400000 # 24 hours

logging:
  level:
    root: INFO
    com.verdant.crm: DEBUG
    org.springframework.security: INFO
